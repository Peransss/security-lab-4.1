name: DevSecOps Pipeline

on:
  push:
  pull_request:

# Prinsip least privilege: workflow hanya boleh membaca isi repo
permissions:
  contents: read

# Versi tool di-pin + checksum diverifikasi.
# Kenapa? Supaya tool keamanan tidak bisa diganti diam-diam (lihat insiden supply chain Trivy, Maret 2026).
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  SEMGREP_VERSION: "1.177.0"

jobs:
  # ------------------------------------------------------------
  # CI dasar: install -> unit test.  (sudah HIJAU dari awal)
  # Tugas Anda: menambahkan security check ke pipeline ini.
  # ------------------------------------------------------------
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PAYMENT_GATEWAY_API_KEY: ${{ secrets.PAYMENT_GATEWAY_API_KEY }}

    steps:
      # Action di-pin ke commit SHA (bukan tag) agar tidak bisa diganti diam-diam
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check required environment variables
        run: |
          node -e "console.log('JWT_SECRET tersedia:', Boolean(process.env.JWT_SECRET))"
          node -e "console.log('PAYMENT_GATEWAY_API_KEY tersedia:', Boolean(process.env.PAYMENT_GATEWAY_API_KEY))"

      - run: npm test

  test:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Application
        run: |
          npm start > app.log 2>&1 &

      - name: Wait for Application
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:3000/welcome | grep -q "^200$"; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to start"
          cat app.log
          exit 1

      - name: Prepare ZAP report
        run: |
          rm -f "${{ github.workspace }}/zap-report.html"
          touch "${{ github.workspace }}/zap-report.html"

      - name: Test ZAP workspace
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            touch /zap/wrk/zap-test.txt

          ls -l zap-test.txt

      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm -t \
            --network host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000/welcome \
            -m 3 \
            -r zap-report.html

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html

  # >>> TAHAP A: tambahkan job secret-scan di bawah ini

  # ------------------------------------------------------------
  # TAHAP A -- Commit: Secret scanning
  # ------------------------------------------------------------
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Gitleaks (versi di-pin + verifikasi checksum)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan secret di source code
        run: gitleaks dir . --redact --verbose

  # >>> TAHAP B: tambahkan job dependency-scan

  # ------------------------------------------------------------
  # TAHAP B -- Build: Dependency scanning
  # ------------------------------------------------------------
  dependency-scan:
    name: Dependency Scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # Gagal jika ada vulnerability tingkat HIGH atau CRITICAL
      - run: npm audit --audit-level=high

  # >>> TAHAP C: tambahkan job sast

  # ------------------------------------------------------------
  # TAHAP C -- Test: SAST
  # ------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"
      - name: Jalankan SAST
        run: semgrep scan --config .semgrep/ --metrics=off --disable-version-check --error src

  # >>> TAHAP D: tambahkan job deploy (security gate)

  # ------------------------------------------------------------
  # TAHAP D -- Security gate: deploy hanya jika SEMUA pemeriksaan lolos
  # ------------------------------------------------------------
  deploy:
    name: Deploy ke Staging (simulasi)
    needs: [build-test, secret-scan, dependency-scan, sast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Semua security gate lolos. Deploy ke staging (simulasi)."
